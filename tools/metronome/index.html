<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metronome Widget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="metronome" aria-label="Metronome widget">
      <header class="metronome__header">
        <div>
          <h1>Metronome</h1>
          <p>Steady timing for practice sessions</p>
        </div>
        <kbd class="shortcut-hint" title="Keyboard shortcuts: Space, T, Arrow Up, Arrow Down">⌨︎</kbd>
      </header>

      <section class="display" aria-live="polite">
        <div class="tempo-readout">
          <span id="bpmValue">100</span>
          <small>BPM</small>
        </div>
        <div class="pendulum-wrap" aria-hidden="true">
          <div class="pendulum" id="pendulum"></div>
        </div>
        <div id="beatIndicators" class="beat-indicators" role="group" aria-label="Beat indicators"></div>
      </section>

      <section class="control-grid" aria-label="Tempo controls">
        <label for="bpmRange" class="control-label">Tempo</label>
        <input id="bpmRange" type="range" min="30" max="240" value="100" step="1" />

        <div class="tempo-buttons">
          <button id="decrease5" type="button" aria-label="Decrease tempo by 5 BPM">−5</button>
          <button id="increase5" type="button" aria-label="Increase tempo by 5 BPM">+5</button>
        </div>
      </section>

      <section class="row-controls">
        <label class="stacked-field">
          <span>Beats per bar</span>
          <select id="beatsPerBar" aria-label="Beats per bar">
            <option value="2">2 / 4</option>
            <option value="3">3 / 4</option>
            <option value="4" selected>4 / 4</option>
            <option value="5">5 / 4</option>
            <option value="6">6 / 4</option>
          </select>
        </label>

        <label class="toggle-sound" for="soundEnabled">
          <input id="soundEnabled" type="checkbox" checked />
          <span>Sound</span>
        </label>
      </section>

      <section class="button-grid" aria-label="Playback controls">
        <button id="startStopBtn" class="primary" type="button">Start</button>
        <button id="tapBtn" type="button">Tap Tempo (T)</button>
        <button id="resetBtn" type="button">Reset</button>
      </section>

      <footer class="help-text">
        Space = start/stop • T = tap • ↑/↓ = BPM ±1
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
