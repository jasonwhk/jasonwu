name: Build Fire NFC Reader APK
on:
  push:
    branches: [main]
    paths:
      - 'android-nfc-reader/**'
      - '.github/workflows/build-fire-nfc-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-nfc-reader
        run: gradle assembleDebug
      - name: Prepare versioned APK
        run: cp android-nfc-reader/app/build/outputs/apk/debug/app-debug.apk FireNfcReader-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FireNfcReader-v1.1
          path: FireNfcReader-v1.1.apk
          retention-days: 30
      - name: Publish v1.1 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fire-nfc-reader-v1.1 --cleanup-tag --yes || true
          gh release create fire-nfc-reader-v1.1 FireNfcReader-v1.1.apk \
            --title "Fire NFC Reader v1.1" \
            --notes "v1.1 diagnostic build: live USB serial and PN532 reader state, poll counters, raw RX bytes, and tag UID diagnostics."
