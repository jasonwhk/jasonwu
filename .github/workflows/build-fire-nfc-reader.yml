name: Build Fire NFC Reader APK
on:
  push:
    branches: [main]
    paths:
      - 'android-nfc-reader/**'
      - '.github/workflows/build-fire-nfc-reader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-nfc-reader
        run: gradle assembleDebug
      - name: Prepare versioned APK
        run: cp android-nfc-reader/app/build/outputs/apk/debug/app-debug.apk FireNfcReader-v1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FireNfcReader-v1.6
          path: FireNfcReader-v1.6.apk
          retention-days: 30
      - name: Publish v1.6 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fire-nfc-reader-v1.6 --cleanup-tag --yes || true
          gh release create fire-nfc-reader-v1.6 FireNfcReader-v1.6.apk \
            --title "Fire NFC Reader v1.6" \
            --notes "v1.6 diagnostic build: first NFC Music Box build: continuous PN532 tag polling, tag-to-audio assignment, persistent mappings, and playback."
